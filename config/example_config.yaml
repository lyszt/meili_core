# Mesly Configuration Example
# Copy this file to config.yaml and adjust settings

# OCR Settings
ocr:
  engine: "pytesseract"
  languages:
    - "en"
    - "zh"  # Install the matching Tesseract language packs
  confidence_threshold: 0.5

# Translation Settings (local Helsinki-NLP MarianMT, multi-language -> English)
translation:
  service: "helsinki-nlp"
  source_language: "auto"
  target_language: "en"
  cache_enabled: true

# Screen Capture Settings
capture:
  fps: 1  # Captures per second
  region:  # Leave null for full screen
    x: null
    y: null
    width: null
    height: null

# Overlay Settings
overlay:
  enabled: true
  font_size: 14
  background_opacity: 0.8
  position: "bottom"  # Options: top, bottom, custom

# Performance
performance:
  use_gpu: false
  max_threads: 4
  # Specs-based feature gating for NeuTTS (disabled by default)
  min_ram_neutts_gb: 8
  max_swap_used_gb: 6  # Disable NeuTTS when swap used > this (system under pressure)
  neutts_enabled: false
